<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barcode Scanner - Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Code / Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background: #f0f2f5; }
        .app-shell { width: 100%; max-width: 540px; margin: 0 auto; min-height: 100vh; }
        #reader video { border-radius: 12px; object-fit: cover; }
    </style>
</head>
<body class="text-gray-800">

<div class="app-shell flex flex-col min-h-screen bg-white shadow-md">
    
    <!-- Top Header Navigation -->
    <header class="bg-gray-900 text-white p-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <a href="index.html" class="p-1 text-gray-300 hover:text-white flex items-center gap-1 text-xs">
                <span>◀</span>
                <span>Back</span>
            </a>
            <h1 class="text-sm font-bold ml-2">Stock Scanner</h1>
        </div>
        <div class="text-[10px] bg-emerald-600 px-2 py-0.5 rounded text-white font-mono">Camera Active</div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 p-3 space-y-4">
        
        <!-- Scanner Camera Viewport -->
        <div class="bg-black rounded-xl overflow-hidden shadow-inner relative">
            <div id="reader" class="w-full"></div>
        </div>

        <!-- Manual Barcode Search -->
        <div class="flex gap-2">
            <input type="text" id="manualInput" placeholder="Enter barcode or item name manually..." 
                   class="flex-1 px-3 py-2 text-xs border border-gray-300 rounded-lg outline-none focus:border-blue-500">
            <button onclick="searchManual()" class="px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-lg">Search</button>
        </div>

        <!-- Scan Result Card -->
        <div id="resultCard" class="hidden bg-white border border-gray-200 rounded-xl p-4 shadow-sm space-y-2">
            <div class="flex justify-between items-start">
                <div>
                    <span id="resBrand" class="text-[10px] font-bold text-blue-600 uppercase tracking-wider"></span>
                    <h2 id="resName" class="text-sm font-bold text-gray-900"></h2>
                    <p id="resType" class="text-[10px] text-gray-500"></p>
                </div>
                <span id="resStatus" class="bg-green-100 text-green-800 text-[10px] font-bold px-2 py-0.5 rounded">In Stock</span>
            </div>

            <div class="border-t border-gray-100 pt-2 grid grid-cols-2 gap-2 text-xs">
                <div class="bg-gray-50 p-2 rounded">
                    <span class="text-[9px] text-gray-400 block font-semibold">MRP / SALE PRICE</span>
                    <span id="resMrp" class="font-bold text-blue-700 text-sm">$0.00</span>
                </div>
                <div class="bg-gray-50 p-2 rounded">
                    <span class="text-[9px] text-gray-400 block font-semibold">BARCODE / IMEI</span>
                    <span id="resBarcode" class="font-mono text-gray-700 font-bold">-</span>
                </div>
            </div>
        </div>

        <!-- No Result Alert -->
        <div id="notFoundCard" class="hidden bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-xs text-center font-semibold">
            Product not found in physical stock!
        </div>

    </main>
</div>

<script>
    let localProducts = [];

    // Load physical stock database from LocalStorage
    function loadLocalProducts() {
        const raw = localStorage.getItem('inv_products');
        if (raw) {
            try {
                localProducts = JSON.parse(raw);
            } catch (e) {
                console.error("Failed to parse cached stock data.", e);
            }
        }
    }

    function lookupItem(query) {
        if (!query) return;
        const q = query.trim().toLowerCase();
        
        const match = localProducts.find(p => 
            (p.barcode && p.barcode.toLowerCase() === q) || 
            (p.name && p.name.toLowerCase().includes(q))
        );

        const resultCard = document.getElementById('resultCard');
        const notFoundCard = document.getElementById('notFoundCard');

        if (match) {
            document.getElementById('resBrand').innerText = match.brand || 'General';
            document.getElementById('resName').innerText = match.name || 'Unnamed Item';
            document.getElementById('resType').innerText = match.type || 'Standard';
            document.getElementById('resMrp').innerText = typeof match.mrp === 'number' ? '$' + match.mrp.toFixed(2) : match.mrp;
            document.getElementById('resBarcode').innerText = match.barcode || match.id || 'N/A';

            resultCard.classList.remove('hidden');
            notFoundCard.classList.add('hidden');
        } else {
            resultCard.classList.add('hidden');
            notFoundCard.classList.remove('hidden');
        }
    }

    function searchManual() {
        const val = document.getElementById('manualInput').value;
        lookupItem(val);
    }

    // Initialize Camera Scanner
    window.addEventListener('load', () => {
        loadLocalProducts();

        const html5QrCode = new Html5Qrcode("reader");
        const qrCodeSuccessCallback = (decodedText, decodedResult) => {
            lookupItem(decodedText);
        };
        const config = { fps: 10, qrbox: { width: 250, height: 150 } };

        html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
        .catch(err => {
            console.error("Camera access failed", err);
        });
    });
</script>

</body>
</html>
